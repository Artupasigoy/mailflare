<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          // Anti-FOUC: terapkan tema SEBELUM halaman digambar, sesuai scope terakhir.
          // Admin & member punya tema terpisah (theme_admin / theme_member).
          // Halaman member selalu terang; hanya admin yang bisa gelap.
          var scope = localStorage.getItem('theme_last_scope') === 'admin' ? 'admin' : 'member';
          var isDark = scope === 'admin' && localStorage.getItem('theme_admin') === 'dark';
          if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.backgroundColor = '#0e0f12';
            document.documentElement.style.color = '#ededef';
          } else {
            document.documentElement.removeAttribute('data-theme');
            document.documentElement.style.backgroundColor = '#ffffff';
          }
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
